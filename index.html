<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D4E89">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="联络人原型">
<title>指定联络人 · 课堂原型</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box}
:root{--accent:#1D4E89;--tint:#EAF0F8;--ink:#18212B;--ink2:#3D4754;--muted:#55606E;--line:#E3E7EC;--bg:#F3F5F8;--field:#8C96A3;--wbg:#FFF5E6;--wline:#F2C27B;--wink:#7A4A00;--wicon:#B76E00;--okbg:#E8F5EE;--ok:#1E7B4F;--okink:#14593A;--errbg:#FDECEA;--err:#8F1D14;color-scheme:light}
html,body{margin:0;height:100%;background:#D9DEE5}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);font-size:17px;line-height:1.55}
#app.big{font-size:20px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
p,h1,h2,h3{margin:0}
a{color:var(--accent)}
.wm{flex:none;padding:calc(env(safe-area-inset-top) + 5px) 16px 5px;background:#E9ECF1;color:#3D4754;font-size:11px;line-height:16px;letter-spacing:1px;text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nav{flex:none;height:54px;display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.nav h2{text-align:center;font-size:1.125em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;margin-left:6px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;position:relative}
.prog{flex:none;padding:12px 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.bars{display:flex;gap:6px}.bars i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bars i.on{background:var(--accent)}
.prog p{padding:8px 0 10px;font-size:.875em;color:var(--ink2)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{display:flex;flex-direction:column;gap:14px;padding:20px 16px 24px}
.list{display:flex;flex-direction:column;padding:8px 16px 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.p{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.kvs{background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv>span:first-child{flex:none;color:var(--muted)}
.kv>span:last-child{text-align:right}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}
.row:last-child{border-bottom:0}
.scen{border-bottom:1px solid var(--line)}.scen:last-child{border-bottom:0}.scen>.row{border-bottom:0}
.grow{flex:1;min-width:0}
.b{font-weight:700}.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.small{font-size:.875em}.mid{font-size:.9375em}.blk{display:block}
.sec{padding:18px 4px 8px;font-size:.875em;font-weight:700;color:var(--muted)}
.h1{font-size:1.375em;line-height:1.35;font-weight:700}.h1.xl{font-size:1.5em}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.circle.ok{background:var(--okbg);color:var(--ok)}.circle.warn{background:var(--wbg);color:var(--wicon)}
.tile{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile.lg{width:52px;height:52px;border-radius:14px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.av.lg{width:56px;height:56px;font-size:1.375em}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.875em;font-weight:700}
.info,.warn,.okbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px}
.info{background:var(--tint)}
.warn{background:var(--wbg);border:1px solid var(--wline);color:var(--wink);padding:14px}
.okbox{background:var(--okbg);color:var(--okink);padding:14px}
.info>svg,.warn>svg,.okbox>svg{flex:none;margin-top:3px}
.stack{display:flex;flex-direction:column;gap:6px}
.notice{margin-top:8px;padding:12px 14px;border-radius:12px;background:var(--okbg);color:var(--okink);font-weight:700}
.err{padding:10px 14px;border-radius:12px;background:var(--errbg);color:var(--err);font-weight:700}
.tag{flex:none;padding:0 8px;border-radius:10px;font-size:.875em;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wait{background:var(--wbg);color:var(--wink)}.tag.new{background:var(--accent);color:#fff}
.footer{flex:none;display:flex;flex-direction:column;gap:6px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{width:100%;min-height:54px;padding:10px 16px;border-radius:12px;font-size:1.0625em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0}
.btn.p{background:var(--accent);color:#fff}
.btn.s{border:1.5px solid var(--accent);background:#fff;color:var(--accent)}
.btn.t{min-height:44px;background:transparent;color:var(--accent);font-size:1em}
.btn.g{min-height:44px;background:transparent;color:var(--ink2);font-size:1em;font-weight:400}
.btn.dash{border:1.5px dashed var(--field);background:transparent;color:var(--accent);font-size:1em}
.btn.dark{background:var(--ink);color:#fff}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;padding:4px 0;border:0;background:transparent;color:var(--muted);font-size:.875em}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.875em;color:var(--muted)}
.input{width:100%;height:50px;padding:0 14px;border:1.5px solid var(--field);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
.input.amt{height:58px;font-size:1.5em;font-weight:700}
textarea.input{height:auto;min-height:88px;padding:10px 14px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:4px 16px;border:1.5px solid var(--field);border-radius:22px;background:#fff;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sw{flex:none;width:52px;height:32px;padding:3px;border-radius:16px;background:#B9C1CC;display:flex;justify-content:flex-start}
.sw::after{content:"";width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
[aria-checked="true"]>.sw{background:var(--accent);justify-content:flex-end}
.checkrow{width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px 4px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.box{flex:none;width:26px;height:26px;margin-top:1px;border-radius:6px;border:2px solid var(--field);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
[aria-checked="true"]>.box{background:var(--accent);border-color:var(--accent)}
[aria-checked="false"]>.box>svg{display:none}
.stepper{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.stepper>div{display:flex;align-items:center;gap:10px}
.stepbtn{flex:none;width:48px;height:48px;padding:0;border:1.5px solid var(--field);border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center}
.stepval{flex:1;text-align:center;font-size:1.125em;font-weight:700}
.amtline{width:calc(100% - 32px);margin:0 16px 14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-radius:10px;background:var(--bg);font-size:.9375em;text-align:left}
.hello{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#C8372D;border:2px solid var(--bg)}
.balance{background:var(--accent);color:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.balance .amt{font-size:1.75em;font-weight:700;margin-top:10px;line-height:1.3}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px 4px;background:#fff;border:1px solid var(--line);border-radius:14px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border:0;background:transparent;font-size:.875em}
.q>span{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
.paused{width:100%;display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--wline);border-radius:14px;background:var(--wbg);color:var(--wink);text-align:left}
.banner{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.banner .x{position:absolute;top:4px;right:4px;margin:0;color:var(--muted)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.cardtitle{padding:14px 16px 8px;font-weight:700}
.li{display:flex;gap:10px;align-items:flex-start}.li>svg{flex:none;margin-top:4px}
.mock{background:#fff;border:1.5px dashed var(--field);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fake{width:100%;padding:10px;border-radius:10px;font-weight:700}
.simbar{margin:16px 16px 0;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;border-radius:12px;font-size:.9375em}
.bubble{padding:12px 14px;background:var(--bg);border-radius:4px 16px 16px 16px;font-size:.9375em;line-height:1.6}
.sheetwrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(24,33,43,.5)}
.sheet{display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0}
.grip{align-self:center;width:40px;height:4px;border-radius:2px;background:#D3D9E0}
.callov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 72px) 24px calc(40px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;text-align:center}
.callov .av{width:104px;height:104px;background:#3A4654;color:#fff;font-size:2.5em}
.hang{margin-top:auto;width:72px;height:72px;padding:0;border:0;border-radius:50%;background:#C8372D;color:#fff;display:flex;align-items:center;justify-content:center}
.panelwrap{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.panel{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.plain{flex:1;min-height:0;overflow-y:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;background:#fff}
.qcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.qtag{align-self:flex-start;padding:0 8px;border-radius:10px;background:var(--tint);color:var(--accent);font-size:.8125em;font-weight:700}
.result{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:.875em;line-height:1.5;background:var(--bg)}
.sms{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
.smshead{flex:none;padding:16px 20px 10px}
.thread{width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px 16px 14px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}
.unread{flex:none;width:10px;padding-top:22px;display:flex;justify-content:center}
.unread i{display:block;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.9375em;color:var(--ink2)}
.tbar{flex:none;height:56px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);position:relative}
.tbar .who{position:absolute;left:96px;right:96px;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;min-height:0;overflow-y:auto;background:var(--bg);padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px}
.msg{align-self:flex-start;max-width:86%;padding:12px 14px;background:#fff;border:1px solid #D6D6D2;border-radius:4px 18px 18px 18px;line-height:1.6}
.mtime{align-self:center;font-size:.8125em;color:var(--muted)}
.reply{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<noscript>请开启 JavaScript 才能使用这个原型。</noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
